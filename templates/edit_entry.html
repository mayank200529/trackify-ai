{% extends "base.html" %}

{% block content %}

<h2>Edit Learning Entry</h2>

<form method="POST">

    <label>Topic:</label><br>
    <input type="text" name="topic" value="{{ entry.topic }}"><br><br>

    <label>Hours Studied:</label><br>
    <input type="number" step="0.5" name="hours" value="{{ entry.hours }}"><br><br>

    <label>Category:</label><br>
    <select name="category">
        <option {% if entry.category == "DSA" %}selected{% endif %}>DSA</option>
        <option {% if entry.category == "SQL" %}selected{% endif %}>SQL</option>
        <option {% if entry.category == "CS Core" %}selected{% endif %}>CS Core</option>
        <option {% if entry.category == "Project" %}selected{% endif %}>Project</option>
        <option {% if entry.category == "Aptitude" %}selected{% endif %}>Aptitude</option>
    </select><br><br>

    <label>Date:</label><br>
    <input type="date" name="entry_date" value="{{ entry.entry_date }}"><br><br>

    <button type="submit">Update Entry</button>

</form>

<br>
<a href="/learning">Back</a>

{% endblock %}
